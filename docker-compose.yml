# =============================================================================
# Growasy / Automiq — PRODUCTION stack for a single Hostinger VPS (KVM 4).
#
#   nginx (edge: serves the React SPA + reverse-proxies /api) ── public 80/443
#     └─ api    (NestJS, internal :4000)  ─┐
#     └─ worker (BullMQ consumer)          ├─ mysql (:3306) + redis (:6379)
#                                          ┘   (both internal-only, never exposed)
#
# One-time:   cp .env.example .env   &&   edit .env   (only manual step)
# Deploy:     ./scripts/deploy.sh    (build/pull → migrate → up → health-check)
# Bring up:   docker compose up -d
#
# Design notes (why it's shaped this way):
#  * Only nginx publishes ports. MySQL/Redis/API/Worker talk over the private
#    `growasy` bridge network — nothing else is reachable from the internet.
#  * The API is stateless (sessions live in MySQL, tokens are JWT) so it can be
#    scaled to N replicas or moved to its own host with zero code changes.
#  * Migrations run as a one-shot in deploy.sh, never on container start — so
#    restarts/scale-ups never race on schema changes.
#  * This is the single-VPS topology; to split DB/Redis onto their own boxes
#    later, delete the mysql/redis services here and point the *_HOST vars at
#    the new hosts. Nothing else changes.
# =============================================================================

name: growasy

# ---- shared config (YAML anchors) -------------------------------------------
# JSON logs, capped + rotated, so a chatty container can never fill the 200GB
# disk. 10MB × 3 files = ~30MB max per container.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

# Hardening applied to the two Node services (api, worker).
x-node-security: &node-security
  read_only: true # immutable root FS — nothing can be written except tmpfs below
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # ---------------------------------------------------------------------------
  # MySQL 8.0 — the schema is a MySQL-5.6-compatible subset, so 8.0 runs it as-is
  # while giving us a supported, secure engine. Internal-only; no host port.
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # native_password keeps auth simple/compatible for the mysql2 driver on a
    # private network (no surprise caching_sha2 handshakes).
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [growasy]
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 4G }
        reservations: { memory: 1G }

  # ---------------------------------------------------------------------------
  # Redis 7 — BullMQ broker. Password-protected, AOF-persisted, noeviction
  # (BullMQ job data must never be evicted). Internal-only.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [growasy]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
   # cap_drop: [ALL]
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 512M }
        reservations: { memory: 128M }

  # ---------------------------------------------------------------------------
  # API — NestJS + Prisma. Internal-only (nginx proxies to it).
  # ---------------------------------------------------------------------------
  api:
    image: ${IMAGE_REGISTRY:-growasy}/growasy-api:${IMAGE_TAG:-latest}
    build:
      context: ./growasy-api
      args:
        NODE_VERSION: '22'
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    networks: [growasy]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    <<: *node-security
    init: true # tini as PID 1 → clean SIGTERM handling / no zombie processes
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1G }
        reservations: { memory: 256M }

  # ---------------------------------------------------------------------------
  # Worker — BullMQ consumer (webhook processing + DM sending). No public API.
  # ---------------------------------------------------------------------------
  worker:
    image: ${IMAGE_REGISTRY:-growasy}/growasy-worker:${IMAGE_TAG:-latest}
    build:
      context: ./growasy-worker
      args:
        NODE_VERSION: '22'
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      HEALTH_PORT: '4100'
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    networks: [growasy]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    <<: *node-security
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '1.5', memory: 1G }
        reservations: { memory: 256M }

  # ---------------------------------------------------------------------------
  # nginx — the public edge. This is the growasy-web image (SPA baked in) with
  # the full reverse-proxy config mounted over its SPA-only default. Serves the
  # React app and proxies /api → api:4000. TLS certs mounted read-only.
  # ---------------------------------------------------------------------------
  nginx:
    image: ${IMAGE_REGISTRY:-growasy}/growasy-web:${IMAGE_TAG:-latest}
    build:
      context: ./growasy-web
      args:
        NODE_VERSION: '22'
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks: [growasy]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE] # bind 80/443 + drop workers to nginx user
    init: true
    logging: *default-logging
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { memory: 64M }

networks:
  growasy:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  certbot_conf: # Let's Encrypt certs (issued/renewed by the certbot flow in the README)
  certbot_www: # ACME http-01 webroot
