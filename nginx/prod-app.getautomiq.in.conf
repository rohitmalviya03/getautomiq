# =============================================================================
# PRODUCTION nginx for app.getautomiq.in
# Copy this over /etc/nginx/sites-available/getautomiq (the app server block).
#
# What's new vs the previous version:
#   1. `map $is_crawler` — identifies search + AI crawlers by user agent.
#   2. /blog — crawlers get server-rendered HTML from the API, humans get the SPA.
#   3. /sitemap.xml and /llms.txt — served from the API so newly published posts
#      appear immediately instead of at the next frontend build.
#
# Check the API port before applying:  grep ^PORT ~/growasy/growasy-api/.env
# =============================================================================

# Crawlers that do NOT execute JavaScript. Without dynamic rendering they see
# only `<div id="root"></div>` on every blog post.
# `map` belongs to the http{} context — sites-enabled files are included there,
# so keeping it at the top of this file is valid.
map $http_user_agent $is_crawler {
    default 0;
    "~*(googlebot|bingbot|duckduckbot|yandex|baiduspider|applebot|slurp)"           1;
    "~*(gptbot|oai-searchbot|chatgpt-user|perplexitybot|claudebot|claude-web)"      1;
    "~*(google-extended|anthropic-ai|cohere-ai|bytespider|amazonbot|ccbot)"         1;
    "~*(facebookexternalhit|twitterbot|linkedinbot|slackbot|whatsapp|telegrambot)"  1;
}

server {
    listen 80;
    server_name app.getautomiq.in;

    return 301 https://app.getautomiq.in$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.getautomiq.in;

    ssl_certificate /etc/letsencrypt/live/getautomiq.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getautomiq.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /root/growasy/growasy-web/dist;
    index index.html;

    # ---- Blog: dynamic rendering for crawlers -------------------------------
    # `if` and `try_files` don't cooperate inside one location, so the crawler
    # branch hands off to a named location via an unused status code. This is the
    # standard way to express "one of two handlers" without nesting them.
    location ^~ /blog {
        error_page 418 = @crawler_render;
        if ($is_crawler = 1) {
            return 418;
        }
        try_files $uri /index.html;
    }

    location @crawler_render {
        # $request_uri keeps /blog and /blog/<slug> (plus any query) intact.
        proxy_pass http://127.0.0.1:4000/api/v1/seo$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A slow render must not hang a crawler.
        proxy_read_timeout 15s;
    }

    # ---- SEO files: always from the API -------------------------------------
    # These list content created after the last build, so a static file can't do it.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:4000/api/v1/seo/sitemap.xml;
        proxy_set_header Host $host;
    }

    location = /llms.txt {
        proxy_pass http://127.0.0.1:4000/api/v1/seo/llms.txt;
        proxy_set_header Host $host;
    }

    # ---- SPA ----------------------------------------------------------------
    # Hashed asset filenames change on every build, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
