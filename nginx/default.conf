# =============================================================================
# Growasy edge nginx — serves the React SPA and reverse-proxies /api → api:4000.
# Mounted (read-only) into the nginx container by docker-compose over the image's
# baked SPA-only default. Included inside the stock nginx http{} block.
#
# HTTP (port 80) is fully functional out of the box so `docker compose up -d`
# works immediately. HTTPS is a ready-to-enable block at the bottom — issue a
# cert first (see README / scripts), then uncomment it and reload nginx.
# =============================================================================

# ---- rate-limit buckets (http context; conf.d is inside http{}) -------------
# General API traffic, and a much tighter bucket for auth (brute-force guard).
limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

# ---- gzip -------------------------------------------------------------------
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
  text/plain text/css application/javascript application/json
  application/xml application/rss+xml image/svg+xml font/woff2;

server_tokens off;

# The API service (Docker DNS resolves `api` on the growasy network). Add more
# `server` lines here to load-balance across API replicas — it's stateless.
upstream growasy_api {
    server api:4000;
    keepalive 32;
}

# ============================ HTTP (port 80) =================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12m;

    # --- security headers (edge). The SPA/API also set their own via helmet. ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # --- ACME http-01 challenge (Let's Encrypt webroot) ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # --- edge health probe ---
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- API reverse proxy (/api/... → NestJS global prefix "api") ---
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://growasy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        # Meta webhooks / long-held connections need a generous read timeout.
        proxy_read_timeout    75s;
    }

    # Extra-strict limiting on auth endpoints (login/register/refresh/reset).
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://growasy_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- static assets: hashed filenames → cache hard; never cache the shell ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- SPA fallback (React Router owns client-side routes) ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ============================ HTTPS (port 443) ===============================
# ENABLE AFTER ISSUING A CERT:
#   1) Point your domain's A record at the VPS.
#   2) Issue the cert (writes into the certbot_conf volume), e.g.:
#        docker run --rm \
#          -v growasy_certbot_conf:/etc/letsencrypt \
#          -v growasy_certbot_www:/var/www/certbot \
#          certbot/certbot certonly --webroot -w /var/www/certbot \
#          -d your-domain.com --email you@example.com --agree-tos --no-eff-email
#   3) Replace `your-domain.com` below, uncomment this block, and in the port-80
#      server replace the SPA/`location /` bits with a redirect to https.
#   4) `docker compose exec nginx nginx -s reload`
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name your-domain.com;
#
#     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
#     add_header X-Content-Type-Options nosniff always;
#     add_header X-Frame-Options SAMEORIGIN always;
#     add_header Referrer-Policy strict-origin-when-cross-origin always;
#
#     root /usr/share/nginx/html;
#     index index.html;
#     client_max_body_size 12m;
#
#     # (identical /healthz, /api/, /api/v1/auth/, /assets/, /index.html and
#     #  `location /` blocks as the port-80 server above)
# }
