# =============================================================================
# Dynamic rendering for crawlers — paste into the PRODUCTION nginx config on the
# VPS (/etc/nginx/sites-available/getautomiq), not just this repo.
#
# WHY
# The app is a client-rendered SPA. A client that doesn't execute JavaScript
# fetches /blog/some-post and receives `<div id="root"></div>` — no title, no
# text. Google renders JS (slowly, and not always); the AI answer engines we
# explicitly welcome in robots.txt — GPTBot, PerplexityBot, ClaudeBot — do not
# render at all. Without this block the blog is invisible to them.
#
# WHAT IT DOES
# Crawler requests for /blog and /blog/<slug> are proxied to the API, which
# returns a complete HTML document: real <title>, meta description, canonical,
# Open Graph, JSON-LD and the full article body. Humans keep getting the SPA.
#
# This is dynamic rendering, not cloaking: the text served to a crawler is the
# same text a browser ends up displaying. Serving *different* content would be a
# policy violation — don't.
# =============================================================================

# ---- 1. http{} context: put this OUTSIDE any server block -------------------
# (In sites-available it can go at the very top of the file only if the file is
#  included inside http{}; otherwise add it to /etc/nginx/nginx.conf.)
#
# map $http_user_agent $is_crawler {
#     default 0;
#     "~*(googlebot|bingbot|duckduckbot|yandex|baiduspider|applebot|slurp)"        1;
#     "~*(gptbot|oai-searchbot|chatgpt-user|perplexitybot|claudebot|claude-web)"   1;
#     "~*(google-extended|anthropic-ai|cohere-ai|bytespider|amazonbot|ccbot)"      1;
#     "~*(facebookexternalhit|twitterbot|linkedinbot|slackbot|whatsapp|telegrambot)" 1;
# }

# ---- 2. Inside the server{} block that serves the SPA -----------------------

# Blog: crawlers get server-rendered HTML, humans get the SPA.
location ^~ /blog {
    if ($is_crawler = 1) {
        # $request_uri keeps the slug and any query string intact.
        proxy_pass https://api.getautomiq.in/api/v1/seo$request_uri;
        break;
    }
    try_files $uri /index.html;
}

# Sitemap and llms.txt come from the API for everyone — they must list posts
# that were published after the last frontend build, which a static file can't.
location = /sitemap.xml {
    proxy_pass https://api.getautomiq.in/api/v1/seo/sitemap.xml;
    proxy_set_header Host api.getautomiq.in;
}

location = /llms.txt {
    proxy_pass https://api.getautomiq.in/api/v1/seo/llms.txt;
    proxy_set_header Host api.getautomiq.in;
}

# ---- 3. Verify after reloading ----------------------------------------------
#   nginx -t && systemctl reload nginx
#
#   # As a crawler — should print the POST's title, not the site-wide one:
#   curl -s -A "GPTBot/1.0" https://app.getautomiq.in/blog/<slug> | grep -o '<title>[^<]*'
#
#   # As a browser — should print the SPA shell title:
#   curl -s https://app.getautomiq.in/blog/<slug> | grep -o '<title>[^<]*'
#
#   # Sitemap should now contain /blog/ URLs:
#   curl -s https://app.getautomiq.in/sitemap.xml | grep -c '/blog/'
