<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#000000" />

    <!-- ===== SEO =====
         Canonical host is app.getautomiq.in. Every absolute URL here — canonical,
         og:url, JSON-LD @id/url — plus robots.txt, sitemap.xml and llms.txt must
         use it. A canonical pointing at a host that doesn't serve the site tells
         Google to consolidate everything onto a dead URL. -->
    <title>Automiq - Instagram Automation for Creators &amp; Businesses</title>
    <meta
      name="description"
      content="Automate Instagram DMs, comment replies, lead capture and customer engagement with Automiq."
    />
    <meta
      name="keywords"
      content="instagram automation, auto dm, comment automation, instagram bot, ai dm, creator tools, business automation"
    />
    <meta name="author" content="Automiq" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://app.getautomiq.in/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Automiq" />
    <meta
      property="og:title"
      content="Automiq - Instagram Automation for Creators &amp; Businesses"
    />
    <meta
      property="og:description"
      content="Automate Instagram DMs, comment replies, lead capture and customer engagement with Automiq."
    />
    <meta property="og:url" content="https://app.getautomiq.in/" />
    <meta property="og:image" content="https://app.getautomiq.in/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Automiq - Instagram Automation for Creators &amp; Businesses"
    />
    <meta
      name="twitter:description"
      content="Automate Instagram DMs, comment replies, lead capture and customer engagement with Automiq."
    />
    <meta name="twitter:image" content="https://app.getautomiq.in/og-image.png" />

    <!-- ===== Structured data (Schema.org) — parsed by Google & AI engines =====
         `offers` was removed on purpose: prices are now admin-editable in the
         database, so hardcoding them here would drift from what the pricing
         section renders, and Google penalises structured data that disagrees
         with the visible page. Emit them from /api/v1/plans if rich pricing
         results are wanted. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://app.getautomiq.in/#org",
            "name": "Automiq",
            "url": "https://app.getautomiq.in/",
            "logo": "https://app.getautomiq.in/logo.png",
            "description": "Instagram automation platform for creators and businesses.",
            "sameAs": ["https://www.instagram.com/getautomiq"]
          },
          {
            "@type": "WebSite",
            "@id": "https://app.getautomiq.in/#website",
            "url": "https://app.getautomiq.in/",
            "name": "Automiq",
            "publisher": { "@id": "https://app.getautomiq.in/#org" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Automiq",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "description": "Automate Instagram DMs, comment replies, lead capture and customer engagement with Automiq.",
            "url": "https://app.getautomiq.in/",
            "image": "https://app.getautomiq.in/og-image.png",
            "publisher": { "@id": "https://app.getautomiq.in/#org" },
            "featureList": [
              "Comment to DM automation",
              "Auto-reply to Instagram comments",
              "DM & story-reply keyword triggers",
              "Lead capture & CRM",
              "Link tracking",
              "Analytics"
            ]
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('growasy-theme');
          var persisted = raw ? JSON.parse(raw).state.theme : null;
          var theme =
            persisted === 'light' || persisted === 'dark'
              ? persisted
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          /* localStorage unavailable or malformed, fall back to light */
        }
      })();
    </script>
  </head>
  <body>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
